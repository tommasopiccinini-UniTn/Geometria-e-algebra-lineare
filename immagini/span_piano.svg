<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Lo span di due vettori linearmente indipendenti nel piano è tutto il piano">
  <rect width="640" height="380" rx="14" fill="#f8fafc"/>
  <text x="26" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Due vettori indipendenti in R²</text>
  <text x="26" y="65" font-family="Arial, sans-serif" font-size="17" fill="#475569">Span(v₁, v₂) = tutto il piano R²</text>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#99f6e4" stroke-width="1.5"/></pattern>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="v1Arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker>
    <marker id="v2Arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="63" y="90" width="514" height="244" fill="#ccfbf1" opacity=".65"/>
  <rect x="63" y="90" width="514" height="244" fill="url(#grid)"/>
  <line x1="63" y1="248" x2="587" y2="248" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="320" y1="334" x2="320" y2="87" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="320" y1="248" x2="469" y2="248" stroke="#0d9488" stroke-width="6" stroke-linecap="round" marker-end="url(#v1Arrow)"/>
  <line x1="320" y1="248" x2="320" y2="119" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#v2Arrow)"/>
  <circle cx="320" cy="248" r="5" fill="#0f172a"/>
  <text x="327" y="270" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">0</text>
  <text x="481" y="238" font-family="Arial, sans-serif" font-size="20" font-style="italic" font-weight="700" fill="#0f766e">v₁</text>
  <text x="330" y="118" font-family="Arial, sans-serif" font-size="20" font-style="italic" font-weight="700" fill="#1d4ed8">v₂</text>
  <text x="594" y="265" font-family="Arial, sans-serif" font-size="18" fill="#64748b">x</text>
  <text x="333" y="100" font-family="Arial, sans-serif" font-size="18" fill="#64748b">y</text>
</svg>