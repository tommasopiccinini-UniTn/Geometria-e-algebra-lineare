<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Lo span di un vettore non nullo è una retta passante per l'origine">
  <rect width="640" height="380" rx="14" fill="#f8fafc"/>
  <text x="26" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Un vettore non nullo</text>
  <text x="26" y="65" font-family="Arial, sans-serif" font-size="17" fill="#475569">Span(v) = retta per l'origine</text>
  <defs>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="vectorArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker>
  </defs>
  <line x1="64" y1="244" x2="583" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="320" y1="336" x2="320" y2="88" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="75" y1="336" x2="565" y2="152" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
  <line x1="320" y1="244" x2="488" y2="181" stroke="#0f766e" stroke-width="6" stroke-linecap="round" marker-end="url(#vectorArrow)"/>
  <circle cx="320" cy="244" r="5" fill="#0f172a"/>
  <text x="328" y="262" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">0</text>
  <text x="499" y="175" font-family="Arial, sans-serif" font-size="21" font-style="italic" font-weight="700" fill="#0f766e">v</text>
  <text x="592" y="260" font-family="Arial, sans-serif" font-size="18" fill="#64748b">x</text>
  <text x="333" y="103" font-family="Arial, sans-serif" font-size="18" fill="#64748b">y</text>
</svg>